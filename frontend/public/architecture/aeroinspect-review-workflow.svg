<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AeroInspect review workflow architecture</title>
  <desc id="desc">A simulated drone camera sends inspection frames through FastAPI and YOLOv8n-Seg before the annotated result is saved for review.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#263b48" stroke-width="1" opacity=".42"/>
    </pattern>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#132a38"/>
      <stop offset="1" stop-color="#0d171e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#65b8ff"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="14" fill="url(#wash)"/>
  <rect width="1200" height="520" rx="14" fill="url(#grid)"/>
  <path d="M44 84H1156" stroke="#304958" stroke-width="1"/>
  <text x="48" y="52" fill="#8f9da6" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">AEROINSPECT / REVIEW WORKFLOW</text>
  <text x="1150" y="52" text-anchor="end" fill="#57c797" font-family="Arial, sans-serif" font-size="12" font-weight="700">LOCAL PIPELINE</text>

  <g fill="none" stroke="#65b8ff" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)" filter="url(#glow)">
    <path d="M246 258H300"/>
    <path d="M480 258H534"/>
    <path d="M714 258H768"/>
    <path d="M948 258H1002"/>
  </g>
  <g fill="#8f9da6" font-family="Arial, sans-serif" font-size="11">
    <text x="273" y="238" text-anchor="middle">MAVLink + image</text>
    <text x="507" y="238" text-anchor="middle">POST /infer</text>
    <text x="741" y="238" text-anchor="middle">masks + boxes</text>
    <text x="975" y="238" text-anchor="middle">persist</text>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(58 166)">
      <rect width="188" height="184" rx="10" fill="#162632" stroke="#416276" stroke-width="2"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#16344a"/>
      <path d="M27 37h18M36 28v18M30 31l12 12M42 31L30 43" stroke="#65b8ff" stroke-width="2" stroke-linecap="round"/>
      <text x="18" y="87" fill="#e8eef2" font-size="16" font-weight="700">Gazebo + SITL</text>
      <text x="18" y="111" fill="#8f9da6" font-size="12">simulated drone flight</text>
      <rect x="18" y="136" width="82" height="24" rx="5" fill="#16382e"/>
      <circle cx="31" cy="148" r="4" fill="#57c797"/>
      <text x="42" y="152" fill="#57c797" font-size="11" font-weight="700">CONNECTED</text>
    </g>

    <g transform="translate(300 166)">
      <rect width="180" height="184" rx="10" fill="#162632" stroke="#416276" stroke-width="2"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#16344a"/>
      <rect x="27" y="28" width="18" height="15" rx="2" fill="none" stroke="#65b8ff" stroke-width="2"/>
      <circle cx="36" cy="35" r="4" fill="none" stroke="#65b8ff" stroke-width="2"/>
      <text x="18" y="87" fill="#e8eef2" font-size="16" font-weight="700">Onboard camera</text>
      <text x="18" y="111" fill="#8f9da6" font-size="12">settled 640 × 480 frame</text>
      <rect x="18" y="136" width="94" height="24" rx="5" fill="#44351a"/>
      <circle cx="31" cy="148" r="4" fill="#e5b95d"/>
      <text x="42" y="152" fill="#e5b95d" font-size="11" font-weight="700">CAPTURE</text>
    </g>

    <g transform="translate(534 166)">
      <rect width="180" height="184" rx="10" fill="#162632" stroke="#416276" stroke-width="2"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#16344a"/>
      <path d="M27 30h18M27 36h18M27 42h12" stroke="#65b8ff" stroke-width="2" stroke-linecap="round"/>
      <text x="18" y="87" fill="#e8eef2" font-size="16" font-weight="700">FastAPI</text>
      <text x="18" y="111" fill="#8f9da6" font-size="12">local inference service</text>
      <rect x="18" y="136" width="72" height="24" rx="5" fill="#16382e"/>
      <circle cx="31" cy="148" r="4" fill="#57c797"/>
      <text x="42" y="152" fill="#57c797" font-size="11" font-weight="700">READY</text>
    </g>

    <g transform="translate(768 166)">
      <rect width="180" height="184" rx="10" fill="#162632" stroke="#416276" stroke-width="2"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#16344a"/>
      <path d="M27 43l7-12 6 8 7-11" fill="none" stroke="#65b8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="18" y="87" fill="#e8eef2" font-size="16" font-weight="700">YOLOv8n-Seg</text>
      <text x="18" y="111" fill="#8f9da6" font-size="12">crack masks + boxes</text>
      <rect x="18" y="136" width="88" height="24" rx="5" fill="#16382e"/>
      <circle cx="31" cy="148" r="4" fill="#57c797"/>
      <text x="42" y="152" fill="#57c797" font-size="11" font-weight="700">EXP001</text>
    </g>

    <g transform="translate(1002 166)">
      <rect width="148" height="184" rx="10" fill="#162632" stroke="#416276" stroke-width="2"/>
      <rect x="18" y="18" width="36" height="36" rx="8" fill="#16344a"/>
      <path d="M27 30h18v18H27zM31 34h10v10H31z" fill="none" stroke="#65b8ff" stroke-width="2"/>
      <text x="18" y="87" fill="#e8eef2" font-size="16" font-weight="700">Review</text>
      <text x="18" y="111" fill="#8f9da6" font-size="12">annotated result</text>
      <rect x="18" y="136" width="80" height="24" rx="5" fill="#16382e"/>
      <circle cx="31" cy="148" r="4" fill="#57c797"/>
      <text x="42" y="152" fill="#57c797" font-size="11" font-weight="700">SAVED</text>
    </g>
  </g>

  <path d="M94 408H1106" stroke="#304958" stroke-width="1"/>
  <g fill="#6e7d87" font-family="Arial, sans-serif" font-size="11">
    <text x="94" y="442">One source of truth: every frame remains linked to telemetry, model output, and inspection history.</text>
    <text x="1106" y="442" text-anchor="end">AEROINSPECT AI / v1</text>
  </g>
</svg>
